<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="ballGradient" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Ball base -->
  <circle cx="50" cy="50" r="46" fill="url(#ballGradient)" stroke="#333" stroke-width="1.5"/>
  
  <!-- Pentagon pattern (classic football) -->
  <!-- Center pentagon -->
  <path d="M 50,20 L 63,30 L 58,47 L 42,47 L 37,30 Z" fill="#333" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Top hexagons -->
  <path d="M 50,20 L 37,30 L 32,17 L 45,10 Z" fill="white" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M 50,20 L 63,30 L 68,17 L 55,10 Z" fill="white" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Side pentagons -->
  <path d="M 37,30 L 20,35 L 18,50 L 28,58 L 42,47 Z" fill="#333" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M 63,30 L 80,35 L 82,50 L 72,58 L 58,47 Z" fill="#333" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Bottom hexagons -->
  <path d="M 42,47 L 28,58 L 30,72 L 42,78 L 50,70 Z" fill="white" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M 58,47 L 72,58 L 70,72 L 58,78 L 50,70 Z" fill="white" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Bottom pentagon -->
  <path d="M 42,78 L 30,72 L 35,88 L 50,92 Z" fill="#333" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M 58,78 L 70,72 L 65,88 L 50,92 Z" fill="#333" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
